<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Legendador</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Montserrat:wght@900&family=Pacifico&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f2f2f4;--ac:#6c4cff;--mut:#777;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--fg:#f0f0f2;--card:#1f1f23;--mut:#999}}
:root[data-theme="dark"]{--bg:#121214;--fg:#f0f0f2;--card:#1f1f23;--mut:#999}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px -apple-system,Helvetica,Arial,sans-serif;padding:12px;max-width:560px;margin:auto}
h1{font-size:20px;margin:4px 0 10px}
canvas{width:100%;max-height:60vh;object-fit:contain;background:#000;border-radius:12px;display:block}
video{display:none}
button,select,input,textarea{font:inherit;color:var(--fg)}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px}
button.g{background:var(--card);color:var(--fg)}
input,select,textarea{background:var(--card);border:1px solid #8883;border-radius:8px;padding:8px;width:100%}
input[type=color]{padding:2px;height:38px}
input[type=range]{padding:0}
details{background:var(--card);border-radius:12px;margin:10px 0;padding:10px 12px}
summary{font-weight:600}
.r{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}
.r>*{flex:1}
label{font-size:12px;color:var(--mut);display:block}
.seg{display:grid;grid-template-columns:62px 62px 1fr 34px;gap:5px;margin:5px 0}
.seg input{padding:6px;font-size:14px}
.seg button{padding:0}
small{color:var(--mut)}

:root:root:root{--bg:#000;--fg:#fff;--card:#1c1c1f;--ac:#25f4ee;--mut:#8e8e93}
body{padding:0 12px 90px}
#top{position:sticky;top:env(safe-area-inset-top,0px);background:#000;z-index:5;padding:6px 0}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.fb{background:var(--card);padding:8px 14px;border-radius:20px;font-size:14px}
canvas{display:block;max-height:44vh;width:auto;height:auto;max-width:100%;margin:0 auto;border-radius:6px;touch-action:none}
button{color:#000}button.g{color:#fff}
.pn{display:none;margin-top:10px}.pn.on{display:block}
.pn h2{font-size:15px;margin:4px 0 8px}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#111;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:9;border-top:1px solid #2a2a2e}
#nav button{flex:1;background:none;color:var(--mut);border-radius:0;font-size:12px;padding:4px}
#nav button.on{color:var(--ac)}

#empty{display:none;min-height:72vh;align-items:center;justify-content:center}
#empty label{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--mut);font-size:15px}
#empty span{width:104px;height:104px;border-radius:50%;background:var(--ac);color:#000;font-size:60px;line-height:100px;text-align:center;font-weight:300}
.nov #empty{display:flex}
.nov canvas,.nov #prow,.nov .pn,.nov #nav,.nov .fb{display:none!important}
</style>
</head>
<body class="nov">
<div id="top"><div class="bar"><b style="font-size:18px">Legendador</b><label class="fb" for="file">＋ Importar vídeo</label></div><input type="file" id="file" accept="video/*" hidden><div id="empty"><label for="file"><span>+</span>Adicionar vídeo</label></div>
<canvas id="c" width="360" height="640"></canvas>
<video id="v" playsinline></video>
<div class="r" id="prow"><button id="play">▶ Play</button><input type="range" id="seek" min="0" max="1" step="0.01" value="0" style="flex:4"></div>

</div>
<section class="pn" id="p1"><h2>Legendas</h2>
<div class="r"><div><label>Idioma da fala</label><select id="lang"><option value="portuguese">Português</option><option value="english">Inglês</option><option value="spanish">Espanhol</option></select></div><div><label>Qualidade</label><select id="qual"><option value="base" selected>Padrão</option><option value="small">Mais precisa (lenta)</option></select></div><button id="auto" style="flex:2">✨ Gerar legenda</button></div><small id="autost">Transcreve o áudio do vídeo direto no iPhone.</small>
<div class="r"><button class="g" id="addSeg">+ Legenda no tempo atual</button></div>
<div id="segs"></div>
</section>

<section class="pn" id="p2"><h2>Estilo</h2>
<div class="r">
<button class="g" data-p="0">Clássico</button><button class="g" data-p="1">Viral</button><button class="g" data-p="2">Karaokê</button><button class="g" data-p="3">Neon</button>
</div>
<div class="r"><div><label>Modo</label><select id="s_mode"><option value="bloco">Tudo junto</option><option value="palavra">Uma palavra por vez</option><option value="acumula">Palavras aparecendo</option><option value="karaoke">Karaokê (destaca)</option></select></div>
<div><label>Fonte</label><select id="s_font"><option>Montserrat</option><option>Anton</option><option>Bangers</option><option>Permanent Marker</option><option>Pacifico</option><option>Impact</option><option>Arial Black</option><option>Georgia</option><option>Courier New</option><option>Trebuchet MS</option></select></div></div>
<div class="r"><div><label>Texto</label><input type="color" id="s_color"></div><div><label>Destaque</label><input type="color" id="s_hl"></div><div><label>Contorno</label><input type="color" id="s_stroke"></div><div><label>Fundo</label><input type="color" id="s_bgc"></div></div>
<div class="r"><div><label>Tamanho</label><input type="range" id="s_size" min="3" max="16" step="0.5"></div><div><label>Contorno</label><input type="range" id="s_sw" min="0" max="20"></div><div><label>Posição (altura)</label><input type="range" id="s_pos" min="10" max="92"></div></div>
<div class="r"><label><input type="checkbox" id="s_upper" style="width:auto"> MAIÚSCULAS</label><label><input type="checkbox" id="s_bg" style="width:auto"> Caixa de fundo</label><label><input type="checkbox" id="s_pop" style="width:auto"> Efeito pop</label></div>
</section>

<section class="pn" id="p3"><h2>Exportar</h2>
<div class="r"><div><label>Qualidade do vídeo</label><select id="eq"><option value="orig">Original (a mesma do vídeo)</option><option value="1080">1080p (Full HD)</option><option value="2160">4K (2160p)</option></select></div></div>
<div class="r"><button id="exp">Gerar vídeo legendado</button><button class="g" id="srt">Mostrar .srt</button></div>
<small id="st">O vídeo é gravado em tempo real, então leva a duração dele. Mantenha a tela ligada e esta aba aberta.</small>
<video id="out" controls playsinline style="display:none;width:100%;margin-top:8px;border-radius:10px"></video>
<div class="r"><button id="share" style="display:none">💾 Salvar nos Fotos</button><button id="dlb" class="g" style="display:none">⬇ Baixar arquivo</button></div>
<textarea id="srtbox" rows="6" style="display:none"></textarea>
</section>

<nav id="nav"><button data-t="p1" class="on">💬<br>Legendas</button><button data-t="p2">Aa<br>Estilo</button><button data-t="p3">⬆️<br>Exportar</button></nav>
<script>
const $=i=>document.getElementById(i),v=$('v'),cv=$('c'),cx=cv.getContext('2d');
let PX=0,curFile=null,segs=[],dur=0,blob=null,exporting=false,ac,gain,dest;
const S={mode:'palavra',font:'Montserrat',size:9,color:'#ffffff',hl:'#ffe600',stroke:'#000000',bgc:'#000000',sw:8,pos:78,upper:true,bg:false,pop:true};
const P=[
{mode:'bloco',font:'Arial Black',size:6,color:'#ffffff',hl:'#ffffff',stroke:'#000000',sw:8,pos:85,upper:false,bg:true,bgc:'#000000',pop:false},
{mode:'palavra',font:'Montserrat',size:10,color:'#ffffff',hl:'#ffe600',stroke:'#000000',sw:10,pos:60,upper:true,bg:false,pop:true},
{mode:'karaoke',font:'Anton',size:8,color:'#ffffff',hl:'#ffe600',stroke:'#000000',sw:8,pos:78,upper:true,bg:false,pop:false},
{mode:'acumula',font:'Bangers',size:9,color:'#ffffff',hl:'#00f0ff',stroke:'#ff00aa',sw:10,pos:70,upper:true,bg:false,pop:true}];
function sync(){for(const k in S){const e=$('s_'+k);if(!e)continue;if(e.type==='checkbox')e.checked=S[k];else e.value=S[k]}loadFont()}
function loadFont(){try{document.fonts.load('bold 40px "'+S.font+'"')}catch(e){}}
for(const k in S){const e=$('s_'+k);e.addEventListener('input',()=>{S[k]=e.type==='checkbox'?e.checked:e.type==='range'?+e.value:e.value;if(k==='font')loadFont()})}
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{Object.assign(S,P[b.dataset.p]);sync()});
sync();

$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;curFile=f;v.src=URL.createObjectURL(f);v.load()};
v.onloadedmetadata=()=>{document.body.classList.remove('nov');const k=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight));cv.width=Math.round(v.videoWidth*k);cv.height=Math.round(v.videoHeight*k);dur=v.duration;$('seek').max=dur;v.currentTime=0.01;
if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();const s=ac.createMediaElementSource(v);gain=ac.createGain();dest=ac.createMediaStreamDestination();s.connect(gain);gain.connect(ac.destination);s.connect(dest)}catch(e){ac=null}}};
$('play').onclick=()=>{if(ac&&ac.state==='suspended')ac.resume();v.paused?v.play():v.pause()};
v.onplay=()=>$('play').textContent='⏸ Pausar';v.onpause=()=>$('play').textContent='▶ Play';
$('seek').oninput=e=>{v.currentTime=+e.target.value};

function fmt(t){return t.toFixed(2)}
function draw(){requestAnimationFrame(draw);const W=cv.width,H=cv.height;
if(!v.videoWidth){cx.fillStyle='#000';cx.fillRect(0,0,W,H);cx.fillStyle='#888';cx.font='16px sans-serif';cx.textAlign='center';cx.fillText('Escolha um vídeo acima',W/2,H/2);return}
cx.drawImage(v,0,0,W,H);const t=v.currentTime;if(!exporting)$('seek').value=t;
const g=segs.find(s=>t>=s.s&&t<s.e);if(!g)return;
let w=g.t.trim().split(/\s+/).filter(Boolean);if(!w.length)return;
const n=w.length,per=(g.e-g.s)/n;let idx=Math.min(n-1,Math.floor((t-g.s)/per));
let st0=g.s+idx*per;if(g.w&&g.w.length===n){idx=0;for(let q=0;q<n;q++)if(t>=g.w[q].s)idx=q;st0=g.w[idx].s}
let list=w,act=-1,age=t-g.s;
if(S.mode==='palavra'){list=[w[idx]];act=0;age=t-st0}
else if(S.mode==='acumula'){list=w.slice(0,idx+1);act=idx;age=t-st0}
else if(S.mode==='karaoke'){act=idx;age=t-g.s}
if(S.upper)list=list.map(x=>x.toUpperCase());
const fs=W*S.size/100;cx.save();cx.font=`bold ${fs}px "${S.font}",Impact,sans-serif`;cx.textBaseline='middle';cx.textAlign='left';cx.lineJoin='round';
const sp=cx.measureText(' ').width,mx=W*.88,L=[];let cur=[],cw=0;
list.forEach((x,i)=>{const m=cx.measureText(x).width;if(cur.length&&cw+sp+m>mx){L.push({a:cur,w:cw});cur=[];cw=0}cw+=(cur.length?sp:0)+m;cur.push({x,m,i})});L.push({a:cur,w:cw});
const lh=fs*1.25,cy=H*S.pos/100,cxm=W/2+W*PX/100;
if(S.pop){const k=0.7+0.3*Math.min(1,age/0.12);cx.translate(cxm,cy);cx.scale(k,k);cx.translate(-cxm,-cy)}
let y=cy-(L.length*lh)/2+lh/2;
for(const ln of L){let x=cxm-ln.w/2;
if(S.bg){cx.globalAlpha=.65;cx.fillStyle=S.bgc;const p=fs*.3;cx.beginPath();cx.roundRect?cx.roundRect(x-p,y-lh/2,ln.w+2*p,lh,p):cx.rect(x-p,y-lh/2,ln.w+2*p,lh);cx.fill();cx.globalAlpha=1}
for(const o of ln.a){const hot=(S.mode==='karaoke'||S.mode==='acumula')&&o.i===act;
if(S.sw>0){cx.lineWidth=fs*S.sw/40;cx.strokeStyle=S.stroke;cx.strokeText(o.x,x,y)}
cx.fillStyle=hot?S.hl:S.mode==='palavra'?S.hl:S.color;if(S.mode==='palavra')cx.fillStyle=S.color;cx.fillText(o.x,x,y);x+=o.m+sp}
y+=lh}
if(!exporting&&v.paused){const mw=Math.max(...L.map(l=>l.w)),p=fs*.3;cx.setLineDash([8,6]);cx.lineWidth=2;cx.strokeStyle="#25f4ee";cx.strokeRect(cxm-mw/2-p,cy-L.length*lh/2,mw+2*p,L.length*lh)}
cx.restore()}
draw();

function rs(){const d=$('segs');d.innerHTML='';segs.forEach((g,i)=>{const r=document.createElement('div');r.className='seg';
r.innerHTML=`<input type="number" step="0.1" value="${fmt(g.s)}" data-i="${i}" data-f="s"><input type="number" step="0.1" value="${fmt(g.e)}" data-i="${i}" data-f="e"><input value="${g.t.replace(/"/g,'&quot;')}" data-i="${i}" data-f="t"><button class="g" data-del="${i}">✕</button>`;d.appendChild(r)})}
$('segs').addEventListener('input',e=>{const i=e.target.dataset.i,f=e.target.dataset.f;if(i==null)return;segs[i][f]=f==='t'?e.target.value:+e.target.value});
$('segs').addEventListener('focusin',e=>{const i=e.target.dataset.i;if(i!=null&&e.target.dataset.f==='t'){v.currentTime=segs[i].s}});
$('segs').addEventListener('click',e=>{const i=e.target.dataset.del;if(i!=null){segs.splice(+i,1);rs()}});
$('addSeg').onclick=()=>{const t=v.currentTime||0;segs.push({s:t,e:Math.min(dur||t+2,t+2),t:'Texto'});segs.sort((a,b)=>a.s-b.s);rs()};
let asr=null,asrId='',TFM=null,busy=false;
$('auto').onclick=async()=>{
const st=$('autost');if(busy)return;
if(!curFile){alert('Escolha um vídeo primeiro');return}
busy=true;$('auto').disabled=true;const errs=[];
const E=e=>String(e&&e.message?e.message:e);
try{
st.textContent='Lendo o áudio do vídeo…';
const buf=await curFile.arrayBuffer();
const AC=window.AudioContext||window.webkitAudioContext,a=new AC();
const dec=await new Promise((res,rej)=>{const p=a.decodeAudioData(buf,res,rej);if(p&&p.catch)p.catch(rej)});
const OC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
const oc=new OC(1,Math.ceil(dec.duration*16000),16000);
const sc=oc.createBufferSource();sc.buffer=dec;sc.connect(oc.destination);sc.start();
const pr=oc.startRendering();
const rb=pr&&pr.then?await pr:await new Promise(r=>{oc.oncomplete=e=>r(e.renderedBuffer)});
const audio=rb.getChannelData(0),SR=16000,WIN=20*SR;
const cuts=[0];
while(audio.length-cuts[cuts.length-1]>WIN*1.25){const t=cuts[cuts.length-1]+WIN;let best=t,bv=1e12;
for(let i=t-1.5*SR;i<t+1.5*SR;i+=3200){let e=0;for(let j=i;j<i+3200&&j<audio.length;j+=8)e+=Math.abs(audio[j]);if(e<bv){bv=e;best=i+1600}}
cuts.push(Math.round(best))}
cuts.push(audio.length);
const runAll=async()=>{const all=[];
for(let k=0;k<cuts.length-1;k++){
st.textContent='Transcrevendo… parte '+(k+1)+' de '+(cuts.length-1);
const part=audio.slice(cuts[k],cuts[k+1]),off=cuts[k]/SR;
const o=await asr(part,{language:$('lang').value,task:'transcribe',return_timestamps:'word'});
(o.chunks||[]).forEach(c=>{const x=(c.text||'').trim();if(!x)return;const s0=(c.timestamp[0]||0)+off;all.push({x,s:s0,e:(c.timestamp[1]!=null?c.timestamp[1]+off:s0+0.4)})})}
return all};
if(!TFM){st.textContent='Baixando arquivos adicionais…';
for(const vs of ['3.5.1','3.0.2']){try{TFM=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@'+vs);break}catch(e){errs.push('lib '+vs+': '+E(e));TFM=null}}
if(!TFM)throw new Error('lib');try{TFM.env.backends.onnx.wasm.numThreads=1}catch(e){}}
const ids=$('qual').value==='small'?['onnx-community/whisper-small_timestamped','onnx-community/whisper-base_timestamped']:['onnx-community/whisper-base_timestamped'];
let words=null;
for(const id of ids){try{
if(asrId!==id){asr=null;asrId='';st.textContent='Baixando arquivos adicionais…';asr=await TFM.pipeline('automatic-speech-recognition',id,{dtype:'q8',device:'wasm'});asrId=id}
words=await runAll();break}catch(e){errs.push(id.slice(16)+': '+E(e));asr=null;asrId=''}}
if(!words)throw new Error('falha');
if(!words.length){st.textContent='Não encontrei fala neste vídeo.';busy=false;$('auto').disabled=false;return}
const ck=3;segs=[];
for(let i=0;i<words.length;i+=ck){const gp=words.slice(i,i+ck);segs.push({s:gp[0].s,e:Math.max(gp[gp.length-1].e,gp[0].s+0.2),t:gp.map(x=>x.x).join(' '),w:gp})}
for(let i=0;i<segs.length-1;i++){if(segs[i+1].s-segs[i].e<0.5)segs[i].e=segs[i+1].s}
rs();v.currentTime=0.01;
st.textContent='Pronto! '+segs.length+' legendas geradas.';
}catch(err){errs.push('fim: '+E(err));st.textContent='Não consegui gerar agora. Toque em Gerar legenda de novo. ['+errs.slice(-2).join(' | ').slice(0,170)+']'}
busy=false;$('auto').disabled=false};
function ts(t){const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=Math.floor(t%60),ms=Math.floor(t%1*1000);const p=(n,l=2)=>String(n).padStart(l,'0');return `${p(h)}:${p(m)}:${p(s)},${p(ms,3)}`}
$('srt').onclick=()=>{const b=$('srtbox');b.value=segs.map((g,i)=>`${i+1}\n${ts(g.s)} --> ${ts(g.e)}\n${g.t}\n`).join('\n');b.style.display='block';b.select()};

$('exp').onclick=async()=>{
if(!dur){alert('Escolha um vídeo primeiro');return}
if(!window.MediaRecorder){$('st').textContent='Este navegador não suporta gravação de vídeo.';return}
const eqv=$("eq").value,vw=v.videoWidth,vh=v.videoHeight,sc=eqv==="orig"?1:(+eqv/Math.min(vw,vh)),tw=Math.round(vw*sc/2)*2,th=Math.round(vh*sc/2)*2,old=[cv.width,cv.height];cv.width=tw;cv.height=th;
const cs=cv.captureStream(30),tr=[...cs.getVideoTracks()];
if(dest&&ac){if(ac.state==='suspended')await ac.resume();tr.push(...dest.stream.getAudioTracks());gain.gain.value=0}
const mt=['video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
const rec=new MediaRecorder(new MediaStream(tr),mt?{mimeType:mt,videoBitsPerSecond:Math.max(4e6,Math.min(6e7,Math.round(tw*th*30*0.12)))}:{}),ch=[];
rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
rec.onstop=()=>{exporting=false;cv.width=old[0];cv.height=old[1];if(gain)gain.gain.value=1;blob=new Blob(ch,{type:rec.mimeType||'video/mp4'});const o=$('out');o.src=URL.createObjectURL(blob);o.style.display='block';$('share').style.display='block';$('dlb').style.display='block';$('st').textContent='Pronto! Toque em Salvar / compartilhar.'};
exporting=true;v.pause();v.currentTime=0;await new Promise(r=>setTimeout(r,300));
rec.start(500);v.play();$('st').textContent='Gravando… não saia desta tela.';
v.onended=()=>{if(exporting)rec.stop()}};
$('share').onclick=async()=>{try{const ext=blob.type.includes('mp4')?'mp4':'webm',f=new File([blob],'legendado.'+ext,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else $('st').textContent='Segure o dedo no vídeo acima para salvar.'}catch(e){$('st').textContent='Segure o dedo no vídeo acima para salvar.'}};

$('dlb').onclick=()=>{if(!blob)return;const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='legendado.'+(blob.type.includes('mp4')?'mp4':'webm');document.body.appendChild(a);a.click();a.remove()};
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#nav button,.pn').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(b.dataset.t).classList.add('on')});
$('p1').classList.add('on');
const pts=new Map();let g0=null,moved=false;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;if(pts.size===2){const[a,b]=[...pts.values()];g0={d:Math.hypot(a.x-b.x,a.y-b.y),s:S.size}}});
cv.addEventListener('pointermove',e=>{const p=pts.get(e.pointerId);if(!p)return;const r=cv.getBoundingClientRect();
if(pts.size===2&&g0){p.x=e.clientX;p.y=e.clientY;const[a,b]=[...pts.values()];S.size=Math.max(3,Math.min(20,g0.s*Math.hypot(a.x-b.x,a.y-b.y)/g0.d));$('s_size').value=S.size;moved=true;return}
const dx=e.clientX-p.x,dy=e.clientY-p.y;if(Math.abs(dx)+Math.abs(dy)>1)moved=true;
